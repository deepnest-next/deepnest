name: build release

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-and-release-linux:
    strategy:
      matrix:
        node-version: [24.x]
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Boost and rpm tooling (only for Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        # `rpm` provides rpmbuild, required by electron-builder to emit the .rpm package
        run: sudo apt-get update && sudo apt-get install -yq libboost-dev rpm

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Get latest release
        id: get_release
        uses: actions/github-script@v6
        with:
          script: |
            // Retrieve the latest release information using the GitHub API
            const release = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            core.setOutput("upload_url", release.data.upload_url);
            core.setOutput("release_id", release.data.id);
            core.setOutput("tag", release.data.tag_name);
            console.log("Found release:", release.data.tag_name);

      - name: Build project
        run: |
          # Install dependencies and run the build script
          npm install
          npm run build

      - name: Package
        run: npx electron-builder build --linux --publish never

      - name: Attach to latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.get_release.outputs.tag }}" dist/*.zip dist/*.deb dist/*.rpm --clobber



  build-and-release-macos:
    strategy:
      matrix:
        node-version: [24.x]
        os: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Boost (only for Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -yq libboost-dev

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Get latest release
        id: get_release
        uses: actions/github-script@v6
        with:
          script: |
            // Retrieve the latest release information using the GitHub API
            const release = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            core.setOutput("upload_url", release.data.upload_url);
            core.setOutput("release_id", release.data.id);
            core.setOutput("tag", release.data.tag_name);
            console.log("Found release:", release.data.tag_name);

      - name: Build project
        run: |
          # Install dependencies and run the build script
          npm install
          npm run build

      - name: Package
        run: npx electron-builder build --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # no signing certificate in CI

      - name: Attach to latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.get_release.outputs.tag }}" dist/*.dmg dist/*.pkg dist/*.zip --clobber

  build-and-release-windows:
    strategy:
      matrix:
        node-version: [24.x]
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Get latest release
        id: get_release
        uses: actions/github-script@v6
        with:
          script: |
            // Retrieve the latest release information using the GitHub API
            const release = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            core.setOutput("upload_url", release.data.upload_url);
            core.setOutput("release_id", release.data.id);
            core.setOutput("tag", release.data.tag_name);
            console.log("Found release:", release.data.tag_name);

      - name: Build project
        run: |
          # Install dependencies and run the build script
          npm install
          npm run build
        shell: bash

      - name: Package
        run: npx electron-builder build --win --publish never
        shell: bash

      - name: Attach to latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.get_release.outputs.tag }}" dist/*.zip --clobber
        shell: bash

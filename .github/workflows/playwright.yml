name: Playwright Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["**.json", "**.js", "**.ts", "**.jsx", "**.tsx", "**.yml"]
  pull_request:
    branches: [main]
    paths: ["**.json", "**.js", "**.ts", "**.jsx", "**.tsx", "**.yml"]
jobs:
  test:
    strategy:
      matrix:
        # Pinned: ubuntu-latest is 26.04 now. Playwright 1.65 recognizes 26.04 but has no
        # system-dependency list or ffmpeg download for it yet, which the steps below need
        # (and the chrome-sandbox fix assumes 24.04). Re-check on Playwright upgrades.
        os: [ubuntu-24.04]
    # Give the job enough headroom for the non-deterministic nester test to
    # retry (playwright retries: 2) with its raised per-test timeout without the
    # job-level timeout cutting a slow-but-valid run short. Flaky-test mitigation.
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    steps:
      - name: boost
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -yq libboost-dev
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 matches Electron 45's bundled Node; CI builds on Node 24 only.
          node-version: 24.x
      - name: Install dependencies
        run: |
          # npm install
          npm ci
          # Since Electron 42 the binary is no longer fetched at install time (it downloads
          # on first launch). Fetch it now so the chrome-sandbox step below can fix it.
          node node_modules/electron/install.js
      - name: Fix Ubuntu 24.04 issue https://github.com/electron/electron/issues/17972
        run: |
          file=node_modules/electron/dist/chrome-sandbox
          sudo chown root $file
          sudo chmod 4755 $file
      - name: Build
        run: npm run build
      # The tests drive Electron (`_electron`), never Playwright's own Chromium: install only
      # the system libraries. Downloading the Chromium build from the Playwright CDN stalled
      # until the job timeout on two runs in a row.
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
      # Playwright's own ffmpeg build, needed for recordVideo in tests/index.spec.ts (not
      # covered by install-deps). It comes from the Playwright CDN, whose Chromium download
      # stalled before (see above), so cap it to fail fast instead of eating the job timeout.
      - name: Install Playwright ffmpeg
        run: npx playwright install ffmpeg
        timeout-minutes: 3
      - name: Run Playwright tests
        run: xvfb-run npm test
        env:
          DEBUG: pw:browser*
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
